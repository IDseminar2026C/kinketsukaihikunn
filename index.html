<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金欠回避くん</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <h1>金欠回避くん</h1>
    <p>家計簿はいらない。今日使っていい額だけわかる。</p>
  </header>

  <main class="container">
    <!-- エリア1：診断結果カード -->
    <section class="card result" id="result-card">
      <h2>本日の防衛ライン</h2>
      <p class="result-amount"><span id="result-value">---</span><span class="unit"> 円 / 日</span></p>
      <p class="result-remaining" id="result-remaining"></p>
      <p class="result-savings" id="result-savings"></p>
      <p class="result-message" id="result-message">数値を入力してください</p>
      <button type="button" class="reset-button" id="reset-button">給料日リセット</button>
    </section>

    <!-- エリア2：基本設定 -->
    <section class="card">
      <h2>基本設定</h2>
      <label>
        収入（円）
        <input type="number" id="income" min="0" inputmode="numeric" placeholder="例：80000">
      </label>
      <label>
        固定費（円）
        <input type="number" id="fixed" min="0" inputmode="numeric" placeholder="例：30000">
      </label>
      <label>
        来月に残したい目標額（円）
        <input type="number" id="goal" min="0" inputmode="numeric" placeholder="例：10000">
      </label>
      <label>
        前月までの貯金額（円）
        <input type="number" id="savings" min="0" inputmode="numeric" placeholder="例：20000">
      </label>
      <label class="check">
        <input type="checkbox" id="use-savings">
        貯金も「使えるお金」に含める
      </label>
    </section>

    <!-- エリア3：今月の状況 -->
    <section class="card">
      <h2>今月の状況</h2>
      <label>
        今月の残り日数（日）
        <input type="number" id="days" min="1" inputmode="numeric" placeholder="例：20">
        <span class="note" id="days-note"></span>
      </label>

      <details class="fold">
        <summary>支出を記録する</summary>
        <div class="entry-form">
          <select id="expense-category" aria-label="カテゴリ">
            <option value="food">食費</option>
            <option value="social">交際費</option>
            <option value="misc">雑費</option>
          </select>
          <input type="number" id="expense-amount" min="1" inputmode="numeric" placeholder="金額（円）" aria-label="金額（円）">
        </div>
        <p class="form-error" id="expense-error"></p>
        <div class="form-buttons">
          <button type="button" class="add-button" id="expense-add">記録する</button>
          <button type="button" class="cancel-button" id="expense-cancel" hidden>キャンセル</button>
        </div>

        <p class="totals">
          食費 <span id="food-total">0</span> 円 ／
          交際費 <span id="social-total">0</span> 円 ／
          雑費 <span id="misc-total">0</span> 円
        </p>
        <p class="total-line">支出の合計：<span id="expense-total">0</span> 円</p>
        <ul class="entry-list" id="expense-list"></ul>
      </details>
    </section>

    <!-- エリア4：残高メモ -->
    <section class="card">
      <h2>残高メモ</h2>
      <details class="fold">
        <summary>場所ごとの残高を記録する</summary>
        <p class="note">表示するだけで、防衛ラインの計算には使いません</p>
        <div class="entry-form">
          <input type="text" id="balance-name" maxlength="20" placeholder="場所（例：PayPay）" aria-label="場所の名前">
          <input type="number" id="balance-amount" min="0" inputmode="numeric" placeholder="金額（円）" aria-label="金額（円）">
        </div>
        <p class="form-error" id="balance-error"></p>
        <div class="form-buttons">
          <button type="button" class="add-button" id="balance-add">追加する</button>
          <button type="button" class="cancel-button" id="balance-cancel" hidden>キャンセル</button>
        </div>

        <p class="total-line">残高の合計：<span id="balance-total">0</span> 円</p>
        <ul class="entry-list" id="balance-list"></ul>
      </details>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
